<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MY VOCABULARY</title><style>
body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;margin:0;background:#f3f6fa;color:#172b43}header{background:#172b43;color:white;padding:20px}header h1{margin:0;font-size:22px}main{max-width:700px;margin:auto;padding:14px}nav{display:flex;gap:6px;overflow:auto;padding:8px 0}button{border:0;border-radius:10px;padding:11px;background:#e1e8f0;font-size:15px}.active,.primary{background:#244d78!important;color:white!important}.page{display:none}.page.active{display:block}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.card,.word,.box{background:white;border-radius:14px;padding:14px;margin:9px 0}.num{font-size:25px;font-weight:bold}.small{font-size:12px;color:#687789}input,textarea{width:100%;box-sizing:border-box;padding:12px;margin:6px 0 12px;border:1px solid #ccd6e0;border-radius:9px;font-size:16px}.choice{display:block;width:100%;text-align:left;background:white;border:1px solid #ccd6e0;margin:7px 0}.correct{background:#e5f5eb!important}.wrong{background:#fff0ef!important}
</style></head><body><header><h1>MY VOCABULARY</h1><div class="small">YOUR PERSONAL ENGLISH WORD SYSTEM</div></header><main>
<nav><button class="tab active" data-p="home">ホーム</button><button class="tab" data-p="add">登録</button><button class="tab" data-p="words">単語帳</button><button class="tab" data-p="quiz">テスト</button><button class="tab" data-p="weak">苦手</button></nav>
<section id="home" class="page active"><h2>学習状況</h2><div class="grid"><div class="card"><div class="num" id="count">0</div><div class="small">登録単語数</div></div><div class="card"><div class="num" id="weakCount">0</div><div class="small">苦手単語数</div></div><div class="card"><div class="num" id="rate">0%</div><div class="small">正答率</div></div></div><div class="box" id="record">テスト 0回 / 正解 0回</div></section>
<section id="add" class="page"><h2>単語登録</h2><form id="form"><div>英単語 *</div><input id="english" required placeholder="improve"><div>意味 *</div><input id="meaning" required placeholder="改善する"><div>例文（任意）</div><textarea id="example"></textarea><button class="primary">登録する</button></form><p id="msg" class="small"></p></section>
<section id="words" class="page"><h2>登録単語</h2><div id="wordList"></div></section>
<section id="quiz" class="page"><h2>4択テスト</h2><div id="quizArea"></div></section>
<section id="weak" class="page"><h2>苦手単語</h2><div id="weakList"></div></section>
</main><script>
const K="my_vocab_simple";let s=JSON.parse(localStorage.getItem(K)||'{"words":[],"total":0,"correct":0}'),cur,answered=false;
function save(){localStorage.setItem(K,JSON.stringify(s));render()}function e(x){return String(x).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>go(b.dataset.p));function go(p){document.querySelectorAll(".page").forEach(x=>x.classList.remove("active"));document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));document.getElementById(p).classList.add("active");document.querySelector(`[data-p="${p}"]`).classList.add("active");if(p==="quiz")quiz();render()}
form.onsubmit=x=>{x.preventDefault();let w=english.value.trim(),m=meaning.value.trim(),ex=example.value.trim();if(s.words.some(a=>a.w.toLowerCase()===w.toLowerCase())){msg.textContent="登録済みです";return}s.words.push({id:Date.now(),w,m,ex,c:0,wr:0});x.target.reset();msg.textContent="登録しました";save();go("words")}
function del(id){s.words=s.words.filter(x=>x.id!==id);save()}
function render(){count.textContent=s.words.length;let weak=s.words.filter(x=>x.wr>0);weakCount.textContent=weak.length;rate.textContent=s.total?Math.round(s.correct/s.total*100)+"%":"0%";record.textContent=`テスト ${s.total}回 / 正解 ${s.correct}回`;wordList.innerHTML=s.words.length?s.words.map(x=>`<div class="word"><b>${e(x.w)}</b><div>${e(x.m)}</div>${x.ex?`<div class="small">${e(x.ex)}</div>`:""}<div class="small">正解 ${x.c} / 不正解 ${x.wr}</div><button onclick="del(${x.id})">削除</button></div>`).join(""):"<div class=box>まだ単語がありません。</div>";weakList.innerHTML=weak.length?weak.map(x=>`<div class=word><b>${e(x.w)}</b><div>${e(x.m)}</div><div class=small>不正解 ${x.wr}回</div></div>`).join(""):"<div class=box>苦手単語はまだありません。</div>"}
function quiz(){answered=false;if(s.words.length<4){quizArea.innerHTML="<div class=box>4択テストには最低4単語必要です。</div>";return}let pool=s.words.filter(x=>x.wr>0);pool=pool.length?pool:s.words;cur=pool[Math.floor(Math.random()*pool.length)];let cs=[cur,...s.words.filter(x=>x.id!==cur.id).sort(()=>Math.random()-.5).slice(0,3)].sort(()=>Math.random()-.5);quizArea.innerHTML=`<div class=box><div class=small>この英単語の意味は？</div><h1>${e(cur.w)}</h1></div>`+cs.map((x,i)=>`<button class=choice data-id="${x.id}">${"ABCD"[i]}　${e(x.m)}</button>`).join("");quizArea.querySelectorAll(".choice").forEach(b=>b.onclick=()=>ans(+b.dataset.id))}
function ans(id){if(answered)return;answered=true;s.total++;let ok=id===cur.id;if(ok){s.correct++;cur.c++}else cur.wr++;quizArea.querySelectorAll(".choice").forEach(b=>{b.disabled=true;if(+b.dataset.id===cur.id)b.classList.add("correct");else if(+b.dataset.id===id)b.classList.add("wrong")});quizArea.innerHTML+=`<div class=box><b>${ok?"正解！":"不正解"}</b><p>${e(cur.w)} = ${e(cur.m)}</p><button class=primary onclick="quiz()">次の問題</button></div>`;save()}
render();
</script></body></html>
